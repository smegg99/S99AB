# i18n/locales/en/common.yaml
#
# Keys the layer's own components call. Without them useTranslate falls back
# to the key.

confirm:
  value: "Confirm"
  description: "ConfirmDialog's accept button"
cancel:
  value: "Cancel"
  description: "ConfirmDialog and PromptDialog's dismiss button"
close:
  value: "Close"
  description: "ToastHost and ShortcutHelp's close button"
copy:
  value: "Copy"
  description: "UiCode's copy button, before it is pressed"
copied:
  value: "Copied"
  description: "UiCode's copy button, for the moment after"
retry:
  value: "Retry"
  description: "ErrorState's retry action"
noResults:
  value: "No results"
  description: "DataTable with an active filter and nothing matching"
noResultsHint:
  value: "Try a different search."
  description: "Shown under noResults"
darkTheme:
  value: "Dark theme"
  description: "UiThemeToggle's accessible name and tooltip. The same in both states;
    aria-pressed carries whether the dark theme is on"
menu:
  value: "Menu"
  description: "AppBar's navigation toggle, shown below the rail's breakpoint"
language:
  value: "Language"
  description: "LocaleMenu's accessible name and tooltip"
repeatedCount:
  value: "Repeated {count} times"
  description: "Names the toast repeat marker, which is drawn as a bare number. The
    count's position in the sentence differs between languages."
  placeholders:
    count: {type: integer}
search:
  value: "Search"
  description: "SearchField's label, and any screen that needs the word"
clear:
  value: "Clear"
  description: "Clears the search in UiDataTable's strip"
loading:
  value: "Loading"
  description: "LoadingState's live region; its visual content is not announced"
value:
  value: "Value"
  description: "PromptDialog's field label where the caller names none. Rendered as
    a label, so it stays visible while typing."
linkNewTab:
  value: "{text} (opens in a new tab)"
  description: "A MarkdownInline link's accessible name. Those links always open a
    new tab; the text placeholder lets the translator place the warning."
  placeholders:
    text: {type: string}

highContrast:
  value: "High contrast"
  description: "UiContrastToggle's accessible name and tooltip. The same in both states;
    aria-pressed carries which one it is in"
pending:
  value: "Wait for it to finish."
  description: "Why a dialog's key is disabled while what it started is still running (PromptDialog)"
location:
  value: "Location"
  description: "UiBreadcrumbs' accessible name: the nav landmark that shows where the page sits"
