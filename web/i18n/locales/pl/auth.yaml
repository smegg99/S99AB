# i18n/locales/pl/auth.yaml

starting:
  value: "Rozpoczynanie..."
  description: "UiKratosForm, while it reads the flow Kratos redirected it to"
flowExpired:
  value: "Ten formularz wygasł. Zacznij od nowa."
  description: "UiKratosForm when the flow itself is gone (410, 404 or a stale
    CSRF cookie), where starting over is the fix."
flowUnreachable:
  value: "Nie udało się połączyć z serwerem. Spróbuj ponownie."
  description: "UiKratosForm when the request gets no response: Kratos
    down, a proxy answering 502, or no network. Starting over does not help here."
alreadySignedIn:
  value: "Jesteś już zalogowany."
  description: "UiKratosForm when Kratos refuses a login, registration or
    recovery flow because the reader already holds a session. The screen offers
    a link onward instead of redirecting."
alreadySignedInGo:
  value: "Przejdź do konta"
  description: "The way out of the already-signed-in notice, when the app has
    told the layer where its account screen is."

signIn:
  value: "Zaloguj się"
  description: "UiAccountMenu, signed out"
signUp:
  value: "Załóż konto"
  description: "UiAccountMenu, signed out"
signOut:
  value: "Wyloguj się"
  description: "UiAccountMenu's menu, signed in"
signOutFailed:
  value: "Nie udało się wylogować. Spróbuj ponownie."
  description: "Toast when Kratos refuses the logout call. The session is still active"
account:
  value: "Konto"
  description: "UiAccountMenu's avatar button, screen-reader name"
required:
  value: "Zaloguj się, aby kontynuować"
  description: "UiSignInPrompt, and what a 401 renders as"
noAccount:
  value: "Nie masz jeszcze konta?"
  description: "UiAuthCard, beside the link to registration"
haveAccount:
  value: "Masz już konto?"
  description: "UiAuthCard, beside the link back to sign in"
version:
  value: "wersja"
  description: "UiAuthPage's build plate, written in lower case"
commit:
  value: "commit"
  description: "UiAuthPage's build plate, the short git sha"
built:
  value: "zbudowano"
  description: "UiAuthPage's build plate, when the binary was built"
backHome:
  value: "Wróć"
  description: "UiAuthPage's link out of the signed-out screen. Short for a narrow
    corner; an app can pass its own text through home-label"
showPassword:
  value: "Pokaż hasło"
  description: "The reveal toggle inside a password field. One name in both states;
    aria-pressed carries which it is in"
msg:
  confirmItIsYou:
    value: "Potwierdź, że to Ty, zanim to zmienisz."
    description: "Kratos 1010003, a refresh login asking a signed-in reader for
      their password again."
  codeSent:
    value: "Wysłaliśmy ci kod. Wpisz go tutaj, żeby potwierdzić adres."
    description: "Kratos 1080003, shortened to the instruction shown at the code field"
  chooseCredential:
    value: "Wybierz sposób logowania."
    description: "Kratos 1040009, the info message opening step two of a
      registration. Generic because the step may offer a password, a passkey
      or a one-time code. An app with a single method should override it with
      that method's instruction"
  saved:
    value: "Zapisano."
    description: "Kratos 1050001, a settings flow's message after a successful save"
  badCode:
    value: "Ten kod jest nieprawidłowy albo już użyty. Sprawdź e-mail albo wyślij nowy."
    description: "Kratos 4070006 and 4060006, a verification or recovery code that is wrong or spent"
  passwordShort:
    value: "Hasło musi mieć co najmniej 8 znaków."
    description: "Kratos 4000032. Its own text carries the character count; the rule is what a reader can act on"
  passwordBreached:
    value: "To hasło wyciekło już w innym serwisie. Wybierz inne."
    description: "Kratos 4000034, a password found in a breach corpus"
  passwordSimilar:
    value: "Hasło jest zbyt podobne do twojego adresu e-mail."
    description: "Kratos 4000031, a password too close to the identifier"
  badCredentials:
    value: "Zły e-mail lub hasło."
    description: "Replaces one of Kratos's own sentences. Only ids whose meaning is
      unambiguous are mapped; see composables/kratos/rules.ts"
  exists:
    value: "To konto już istnieje."
    description: "Replaces one of Kratos's own sentences. Only ids whose meaning is
      unambiguous are mapped; see composables/kratos/rules.ts"

forbidden:
  value: "Nie masz do tego dostępu."
  description: "kratosgin.RequireFunc, for a signed-in identity the check refuses.
    Answered as a 404, so this is only ever seen where the app chooses to show it"

# Kratos's own button and field labels, keyed by its stable message id.
# Kratos ships no locale for them. 1070002 is absent: it labels a trait, whose
# title comes from the app's identity schema.
label:
  "1010001":
    value: "Zaloguj się"
    description: "Kratos's submit on a refresh login. A different id from
      1010022, which is the ordinary sign-in button."
  "1040008":
    value: "Wstecz"
    description: "Kratos: the button back to step one of a registration"
  "1070003":
    value: "Zapisz"
    description: "Kratos's Save on a settings flow, one per method group."
  "1070001":
    value: "Hasło"
    description: "Kratos: the password field on sign-in and sign-up"
  "1070007":
    value: "E-mail"
    description: "Kratos: the address field on recovery and verification"
  "1070008":
    value: "Wyślij kod jeszcze raz"
    description: "Kratos: the resend button on verification and recovery, shown
      once a code is already on its way"
  "1070011":
    value: "Kod z e-maila"
    description: "Kratos: the code field on a verification flow"
  "1070009":
    value: "Dalej"
    description: "Kratos: the submit on recovery and verification"
  "1010022":
    value: "Zaloguj się"
    description: "Kratos: the password submit on the login flow"
  "1040001":
    value: "Załóż konto"
    description: "Kratos: the password submit on the registration flow"

disabled:
  value: Serwer logowania wyłączył ten element.
  description: Reason for an authentication control disabled by the identity server when it supplied no specific error
pending:
  value: Poczekaj na zakończenie żądania logowania.
  description: Reason for a disabled submit control while an authentication request is pending
