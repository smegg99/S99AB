# i18n/locales/pl/release.yaml

download:
  value: "Pobierz"
  description: "Every asset row's button"
latest:
  value: "Najnowsza wersja"
  description: "Chip beside the newest version in the download card's header"
yourSystem:
  value: "Twój system"
  description: "Marks the platform tab matching the visitor's own OS"
allReleases:
  value: "Wszystkie wydania"
  description: "Falls back to the repository's releases page"
onGithub:
  value: "Zobacz na GitHubie"
  description: "Link from a changelog entry to that release"
downloads:
  value: "Pliki do pobrania"
  description: "Title of the download dialog"
copied:
  value: "Skopiowano"
  description: "The checksum button, just after it was clicked"
copyHash:
  value: "Skopiuj sumę kontrolną {algo}"
  description: "The checksum button at rest; algo is the digest's algorithm, such as sha256"
  placeholders:
    algo: {type: string}
olderBuild:
  value: "Najnowsza wersja na tę platformę to {version}"
  description: "Tooltip on the version chip of a platform whose newest build is behind the newest release"
  placeholders:
    version: {type: string}
noneTitle:
  value: "Brak plików do pobrania"
  description: "No release is published, or GitHub could not be reached"
noneText:
  value: "Dla tego repozytorium nic jeszcze nie opublikowano."
  description: "Shown under noneTitle"
noHistory:
  value: "Nie opublikowano jeszcze żadnego wydania."
  description: "Changelog with nothing published. Its own key, not noneTitle: that
    one names files to download, which a changelog does not list."
notTranslated:
  value: "Te informacje o wydaniu nie zostały przetłumaczone."
  description: "The release body carried no section for the reader's language"
updateTitle:
  value: "Dostępna jest nowsza wersja"
  description: "Update banner heading"
updateBody:
  value: "Masz wersję {current}. Najnowsza to {latest}."
  description: "Update banner's line under the heading. Both versions are in the message:
    joining them with an arrow reads as \"right arrow\" aloud and fixes which one
    comes first."
  placeholders:
    current: {type: string}
    latest: {type: string}
getUpdate:
  value: "Pobierz"
  description: "Update banner's action"
later:
  value: "Później"
  description: "Dismisses the update banner for this visit"
starOnGithub:
  value: "GitHub"
  description: "Label on the star and fork counter"
starsLabel:
  value: "GitHub: gwiazdki: {stars}"
  description: "RepoStat's whole accessible name with its fork count hidden. The counts
    are in the message because a language inflects the noun by the number and need
    not put it after."
  placeholders:
    stars: {type: integer}
starsForksLabel:
  value: "GitHub: gwiazdki: {stars}, forki: {forks}"
  description: "RepoStat's whole accessible name, both readings. Separator and order
    included: a list joined in the component is one no translator can reorder."
  placeholders:
    stars: {type: integer}
    forks: {type: integer}
changelog:
  value: "Lista zmian"
  description: "Link from the download card to the changelog page"
webBuild:
  value: "Wersja przeglądarkowa"
  description: "Row label of a web platform build"
webBuildSub:
  value: "Statyczna strona do postawienia u siebie"
  description: "Line under webBuild"
plannedNote:
  value: "* Jeszcze bez wersji."
  description: "Under the download card when a platform tab is planned; the asterisk matches the tab marker"
plannedReason:
  value: "Brak wersji na tę platformę."
  description: "Tooltip of a disabled, planned platform tab"
experimentalNote:
  value: "** Eksperymentalne."
  description: "Under the download card when a platform tab is experimental; the two asterisks match the tab marker"
failed:
  value: "Nie udało się wczytać wydań."
  description: "Changelog error title"
beta:
  value: "Beta"
  description: "Default title of the release notice"
feedback:
  value: "Podziel się uwagami lub zgłoś problem"
  description: "Default link label of the release notice"
plannedMark:
  value: "(jeszcze bez wersji)"
  description: "Read by screen readers after a planned platform tab's name, in place of the asterisk"
experimentalMark:
  value: "(eksperymentalne)"
  description: "Read by screen readers after an experimental platform tab's name, in place of the two asterisks"

platforms:
  linux:
    value: "Linux"
  windows:
    value: "Windows"
  macos:
    value: "macOS"
  android:
    value: "Android"
  ios:
    value: "iOS"
  extras:
    value: "Źródła i pliki"
    description: "Source archives, checksums and signatures: not an OS build"
  web:
    value: "Web"

kinds:
  appimage:
    value: "AppImage"
  deb:
    value: "Pakiet Debian"
  rpm:
    value: "Pakiet RPM"
  pkgtarzst:
    value: "Pakiet Arch"
  targz:
    value: "Archiwum tar"
  installer:
    value: "Instalator"
  exe:
    value: "Wersja przenośna"
  msix:
    value: "MSIX"
  zip:
    value: "Archiwum ZIP"
  dmg:
    value: "Obraz dysku"
  binary:
    value: "Surowy plik binarny"
  tarzst:
    value: "Archiwum Zstandard"
  apk:
    value: "Android APK"
  aab:
    value: "Android App Bundle"

# The source archives GitHub builds from the tag.
source:
  zip:
    value: "Kod źródłowy (zip)"
  targz:
    value: "Kod źródłowy (tar.gz)"

notesTitle:
  value: "Co nowego w wersji {version}"
  description: "Release-notes dialog heading; version is the running application version"
  placeholders:
    version: {type: string}

updateDownload:
  value: "Pobierz"
  description: "Update dialog download action"

updateIgnore:
  value: "Pomiń tę wersję"
  description: "Update dialog action that ignores only this version"

updateLater:
  value: "Później"
  description: "Update dialog action that dismisses the prompt for this run"
