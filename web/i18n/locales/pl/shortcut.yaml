# i18n/locales/pl/shortcut.yaml
#
# The app owns `group.<prefix>`: ShortcutHelp heads each group with
# shortcut.group.<prefix> and falls back to the bare registry prefix.
# `key.<name>` uses the registry's lowercase key name, as in alt+arrowleft.
# A letter is its capital and needs no entry.

title:
  value: "Skróty klawiszowe"
  description: "ShortcutHelp dialog title"
none:
  value: "Brak skrótów na tym ekranie."
  description: "ShortcutHelp with an empty registry"
key:
  alt:
    value: "Alt"
    description: "Key cap: the alt key"
  ctrl:
    value: "Ctrl"
    description: "Key cap: the ctrl key"
  shift:
    value: "Shift"
    description: "Key cap: the shift key"
  tab:
    value: "Tab"
    description: "Key cap: the tab key"
  enter:
    value: "Enter"
    description: "Key cap: the enter key"
  escape:
    value: "Esc"
    description: "Key cap: the escape key"
  space:
    value: "Spacja"
    description: "Key cap: the space key"
  backspace:
    value: "Backspace"
    description: "Key cap: the backspace key"
  delete:
    value: "Delete"
    description: "Key cap: the delete key"
  home:
    value: "Home"
    description: "Key cap: the home key"
  end:
    value: "End"
    description: "Key cap: the end key"
  pageup:
    value: "PgUp"
    description: "Key cap: the pageup key"
  pagedown:
    value: "PgDn"
    description: "Key cap: the pagedown key"
  arrowleft:
    value: "Strzałka w lewo"
    description: "Key cap: the arrowleft key"
  arrowright:
    value: "Strzałka w prawo"
    description: "Key cap: the arrowright key"
  arrowup:
    value: "Strzałka w górę"
    description: "Key cap: the arrowup key"
  arrowdown:
    value: "Strzałka w dół"
    description: "Key cap: the arrowdown key"
