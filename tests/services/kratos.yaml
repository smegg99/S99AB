# tests/services/kratos.yaml
version: v1.3.1
dsn: sqlite:///tmp/kratos.db?_fk=true
serve:
  public:
    host: 0.0.0.0
    port: 4433
    base_url: http://127.0.0.1:4433/
  admin:
    host: 0.0.0.0
    port: 4434
selfservice:
  default_browser_return_url: http://127.0.0.1/
  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: false
identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/fixtures/identity.json
courier:
  smtp:
    connection_uri: smtp://127.0.0.1:1025/?disable_starttls=true
secrets:
  cookie:
    - s99ab-disposable-test-cookie-secret
  cipher:
    - 0123456789abcdef0123456789abcdef
log:
  level: error
